version: '3.9'

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - glms-network

  glms-backend-api:
    container_name: glms-backend-api
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - sql-server-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=sql-server-db;
        Database=GLMSDB;
        User Id=sa;
        Password=YourStrong@Passw0rd;
        TrustServerCertificate=True;

    networks:
      - glms-network

  glms-frontend-web:
    container_name: glms-frontend-web
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ApiSettings__BaseUrl: http://glms-backend-api:8080

    networks:
      - glms-network

volumes:
  sql_data:

networks:
  glms-network:
    driver: bridge